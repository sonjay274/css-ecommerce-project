</head>
<body>

    <!-- navbar start here -->
    <i class="fas fa-bars fa-2x" id="menu-icon"></i>
     <nav id="menu" class="hidden">
        <ul class="nav-upper flex-space-around">

                class="nav-link">Home</a>

            <li class="nav-list">
                <a href="register.html"
                class="nav-link">Register</a>

            <li class="nav-list">
                <a href="login.html"
                class="nav-link">Login</a>
            </li>
            <li class="nav-list">
                <a href="index.html"
                class="nav-link">Logout</a>
            </li>
            <li class="nav-list">
                <a href="contact.html"
                class="nav-link">Contact</a>

                class="nav-link"><img class="profile-icon" src="img/sonjay.jpg" alt="profile-icon"></a>

         <ul class="nav-lower flex-space-around">
            <li class="nav-list">

    <!-- navbar end here -->
     <main>
        <section class="register">
            <h2 class="section-title text-center">User Registration</h2>
            <div class="card">
             <form action="" class="form">
                <div class="form-control flex-center">
                    <label for="name">name</label>
                    <input type="text" id="name" 
                    required autocomplete="name">
                </div>
                <div class="form-control flex-center">
                    <label for="email">Email</label>
                    <input type="email" id="email" 
                    required autocomplete="email">
                </div>
                <div class="form-control flex-center">
                    <label for="password">Paddword</label>
                    <input type="password" id="password" 
                    required autocomplete="password">
                </div>
                <div class="form-control flex-center">
                    <label for="about">About me</label>
                    <textarea name="about" id="about"></textarea>
                </div>
                <div class="form-control flex-center form-btn-field">
                    <button type="submit" class="btn contact-btn">submit</button>
                </div>
             </form>   
            </div>
        </section>
     </main>
    <!-- footer start here -->
      <footer class="footer flex-space-around">
        <div class="flex-space-around">
            <label for="subscribe">subscribe to newsletter: </label>
            <input
             type="email"
             id="subscribe"
             name="subscribe"
             class="footer-input"
             placeholder="your email address"
             >
             <button class="btn btn-subscribe">subscribe</button>
        </div>
        <div>
