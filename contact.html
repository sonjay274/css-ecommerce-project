     <main>
        <section class="contact-section">
            <h2 class="section-title text-center">Contact Us</h2>
            <div class="contact-container flex-center">
                <form action="" class="form card">
                    <div class="form-control flex-center">
                        <label for="name">name</label>
                        <input type="text" id="name" 
                        required autocomplete="name">
                    </div>
                    <div class="form-control flex-center">
                        <label for="email">Email</label>
                        <input type="email" id="email" 
                        required autocomplete="email">
                    </div>
                    <div class="form-control flex-center">
                        <label for="message">Message</label>
                        <textarea name="message" id="message"></textarea>
                    </div>
                    <div class="form-control flex-center form-btn-field">
                        <button type="submit" class="btn contact-btn">submit</button>
                    </div>
                </form>
                <div class="contact-address flex-space-around">
                    <address>
                        <h4>Address:</h4>
                        <p>123 high street</p>
                        <p>Bogura,Bangladesh</p>
                        <br>
                        <span>Call: </span>
                        <a href="tel: 01307746074">01307746074</a>
                    </address>
                    <iframe class="contact-map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3620.560743790108!2d89.3597420740112!3d24.844691045890908!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39fc54f839fd9bb3%3A0xecd9f0e7ec49466d!2z4Ka24KeN4Kaw4KeA4Ka24KeN4Kaw4KeAIOCmsOCmvuCmp-CmvuCmruCmvuCmp-CmrCDgpq7gpqjgp43gpqbgpr_gprAtIOCmuOCnh-CmieCmnOCml-CmvuCnnOCngCwg4Kaq4Ka-4Kay4Kaq4Ka-4Kah4Ka84Ka-IChBbmFuZGEgQXNocmFtKQ!5e0!3m2!1sen!2sbd!4v1738766811728!5m2!1sen!2sbd" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </section>
     </main>
